name: Release

# Push a tag like v1.3.0 to build custom-login-page.zip and publish a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' custom-login-page.php | awk '{print $NF}')
          CONST=$(grep -oP "define\('CLP_VERSION', '\K[^']+" custom-login-page.php)
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG does not match plugin Version ($HEADER) / CLP_VERSION ($CONST)"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p build/custom-login-page
          rsync -a --exclude-from=.distignore ./ build/custom-login-page/
          cd build && zip -rq ../custom-login-page.zip custom-login-page

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: custom-login-page.zip
          generate_release_notes: true
